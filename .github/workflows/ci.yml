name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cellier
          POSTGRES_PASSWORD: cellier-test
          POSTGRES_DB: cellier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cellier -d cellier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CELLIER_DATABASE_URL: postgresql+asyncpg://cellier:cellier-test@127.0.0.1:5432/cellier_test
      CELLIER_ENVIRONMENT: test
      CELLIER_MEDIA_DIR: /tmp/cellier-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cellier:test

